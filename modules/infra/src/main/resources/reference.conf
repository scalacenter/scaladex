scaladex {
  elasticsearch {
    index = scaladex-dev
    port = 9200
    reset = false
  }
  database {
    user = user
    user = ${?POSTGRESQL_USERNAME}
    password = password
    password = ${?POSTGRESQL_PASSWORD}
    name = scaladex
    name = ${?POSTGRESQL_DATABASE}
    port = 5432
    url = "jdbc:postgresql://"${scaladex.database.user}":"${scaladex.database.password}"@localhost:"${scaladex.database.port}"/"${scaladex.database.name}
    
    pool {
      maximum-pool-size = 20
      maximum-pool-size = ${?DB_POOL_MAX_SIZE}
      minimum-idle = 5
      minimum-idle = ${?DB_POOL_MIN_IDLE}
      connection-timeout-ms = 30000
      connection-timeout-ms = ${?DB_CONNECTION_TIMEOUT_MS}
      idle-timeout-ms = 600000
      idle-timeout-ms = ${?DB_IDLE_TIMEOUT_MS}
      max-lifetime-ms = 1800000
      max-lifetime-ms = ${?DB_MAX_LIFETIME_MS}
      leak-detection-threshold-ms = 60000
      leak-detection-threshold-ms = ${?DB_LEAK_DETECTION_MS}
    }
  }
  github {
    # follow this tutorial to create your token https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token
    token = ${?GITHUB_TOKEN}
  }
  filesystem {
    contrib = scaladex-contrib
    index = small-index
    temp = /tmp/scaladex/
  }
}
