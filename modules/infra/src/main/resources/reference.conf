scaladex {
  caching {
    refresh-after = 5 minutes
    expire-after = 1 hour
    max-size = 10000
  }
  elasticsearch {
    index = scaladex-dev
    port = 9200
    reset = false
    max-connections = 50
    connect-timeout = 5 seconds
    socket-timeout = 60 seconds
    connection-request-timeout = 5 seconds
  }
  database {
    user = user
    user = ${?POSTGRESQL_USERNAME}
    password = password
    password = ${?POSTGRESQL_PASSWORD}
    name = scaladex
    name = ${?POSTGRESQL_DATABASE}
    port = 5432
    pool-size = 25
    statement-timeout = 10 seconds
    max-concurrent-queries = 50
    url = "jdbc:postgresql://"${scaladex.database.user}":"${scaladex.database.password}"@localhost:"${scaladex.database.port}"/"${scaladex.database.name}
  }
  github {
    # follow this tutorial to create your token https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token
    token = ${?GITHUB_TOKEN}
    http-client {
      throttle {
        requests = 5000
        per = 1 hour
      }
      retry {
        max-retries = 5
        initial-delay = 1 second
        max-delay = 60 seconds
      }
    }
  }
  maven-central {
    http-client {
      throttle {
        requests = 1
        per = 1 second
      }
      retry {
        max-retries = 5
        initial-delay = 1 second
        max-delay = 60 seconds
      }
    }
  }
  filesystem {
    contrib = scaladex-contrib
    index = small-index
    temp = /tmp/scaladex/
  }
}
